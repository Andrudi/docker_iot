{% extends "layout.html" %}
{% block body %}
<div class="row">
  <div class="col-md-7 mb-4">
    <div class="card card-body shadow-sm">
      <form action="{{ url_for('enviar_comando') }}" method="POST">
        <legend class="fw-bold">Panel de Control IoT</legend>
        
        <div class="form-group mb-3">
          <label class="col-form-label" for="mac_destino">Seleccionar Placa</label>
          <select class="form-select" id="mac_destino" name="mac_destino" required>
            <option value="" disabled selected>Elige una MAC de la lista...</option>
            {% for nodo in nodos %}
              <option value="{{ nodo.1 }}">{{ nodo.2 }} ({{ nodo.1 }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group mb-3">
          <label class="col-form-label fw-bold">Comando a enviar</label>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="comando" id="cmdDestello" value="destello" checked>
            <label class="form-check-label" for="cmdDestello">Destello (Parpadeo LED)</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="comando" id="cmdSetpoint" value="setpoint">
            <label class="form-check-label" for="cmdSetpoint">Actualizar Setpoint</label>
          </div>
        </div>

        <div class="form-group mb-4">
          <label class="col-form-label" for="setpoint_val">Valor de Setpoint</label>
          <input type="number" step="0.1" class="form-control" id="setpoint_val" name="setpoint_val" placeholder="Ej: 25.5" disabled>
        </div>

        <button type="submit" class="btn btn-success w-100">Enviar por MQTT</button>
      </form>
    </div>
  </div>

  <div class="col-md-5">
    <div class="card card-body shadow-sm mb-4">
      <form action="{{ url_for('add_nodo') }}" method="POST">
        <legend class="fw-bold">Agregar Placa</legend>
        <div class="form-group mb-3">
          <label class="col-form-label" for="mac">Dirección MAC</label>
          <input type="text" class="form-control" id="mac" name="mac" placeholder="Ej: 08:3A:F2:11:22:33" required>
        </div>
        <div class="form-group mb-3">
          <label class="col-form-label" for="descripcion">Descripción</label>
          <input type="text" class="form-control" id="descripcion" name="descripcion" placeholder="Ej: Sensor Temperatura Cocina" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Guardar MAC</button>
      </form>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-12">
    <table class="table table-hover table-bordered shadow-sm">
      <thead class="table-dark">
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Dirección MAC</th>
          <th scope="col">Descripción</th>
          <th scope="col" class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        {% for nodo in nodos %}
        <tr>
          <td>{{ nodo.0 }}</td>
          <td class="fw-bold text-monospace">{{ nodo.1 }}</td>
          <td>{{ nodo.2 }}</td>
          <td class="text-center">
            <a href="{{ url_for('borrar_nodo', id=nodo.0) }}" class="btn btn-sm btn-danger btn-borrar">Eliminar</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
      const radioDestello = document.getElementById('cmdDestello');
      const radioSetpoint = document.getElementById('cmdSetpoint');
      const inputSetpoint = document.getElementById('setpoint_val');

      function toggleInput() {
          if (radioDestello.checked) {
              inputSetpoint.disabled = true;
              inputSetpoint.value = ''; 
          } else {
              inputSetpoint.disabled = false;
              inputSetpoint.focus();
          }
      }

      radioDestello.addEventListener('change', toggleInput);
      radioSetpoint.addEventListener('change', toggleInput);
  });
</script>
{% endblock %}
